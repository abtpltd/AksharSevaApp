name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Release signing key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
            echo "Signing with the release key."
          else
            echo "::warning::No release key set (ANDROID_KEYSTORE_BASE64). The APK is signed with a throw-away key and phones cannot update over it."
          fi
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Build the Play bundle
        if: env.KEYSTORE_B64 != ''
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: aksharsevak-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish the APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AksharSevak.apk
          gh release create "v${{ github.run_number }}" AksharSevak.apk --title "AksharSevak build ${{ github.run_number }}" --notes "Android app (commit ${GITHUB_SHA::7}). Install the APK on the phone, sign in with the server address https://aksharseva.appspot.com" --latest
      - name: Send the bundle to Google Play (internal testing)
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_B64 != '' && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.aksharsevak.aksharsevak
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

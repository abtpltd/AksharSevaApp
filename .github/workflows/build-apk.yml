name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: aksharsevak-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish the APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AksharSevak.apk
          gh release create "v${{ github.run_number }}" AksharSevak.apk --title "AksharSevak build ${{ github.run_number }}" --notes "Android app (commit ${GITHUB_SHA::7}). Install the APK on the phone, sign in with the server address https://aksharseva.appspot.com" --latest
